<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Vehicle — Fuel QR System</title>
    <meta name="description" content="Search for vehicles by registration number, name, NIC, email, fuel type, or station." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ══ NAVBAR ══════════════════════════════════════════════════ -->
<div id="navbar-container"></div>

<!-- ══ MAIN ════════════════════════════════════════════════════ -->
<main class="page-wrapper">
    <div class="container">

        <!-- Page Header -->
        <div class="page-header">
            <div class="page-tag"> Vehicle Lookup</div>
            <h1>Search Vehicles</h1>
            <p>Find any vehicle by registration number, owner name, NIC, email, fuel type, or nearest station.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Search Form -->
                <div class="fuel-form-card mb-4">
                    <form id="searchForm" novalidate>
                        <div class="form-section-title"> Search Parameters</div>

                        <div class="row g-3">
                            <div class="col-md-5">
                                <label for="searchBy" class="form-label">Search By *</label>
                                <select id="searchBy" class="form-select">
                                    <option value="">— Select field —</option>
                                    <option value="regno"> Registration Number</option>
                                    <option value="firstname"> First Name</option>
                                    <option value="lastname"> Last Name</option>
                                    <option value="email"> Email Address</option>
                                    <option value="nic"> NIC Number</option>
                                    <option value="fueltype"> Fuel Type</option>
                                    <option value="station"> Nearest Station</option>
                                </select>
                            </div>
                            <div class="col-md-7">
                                <label for="searchValue" class="form-label">Search Value *</label>
                                <input type="text" id="searchValue" class="form-control"
                                       placeholder="Select a search type first..." />
                            </div>
                        </div>

                        <!-- Quick Fuel Type Buttons -->
                        <div class="mt-3">
                            <p class="form-label mb-2">Quick Fuel Filter:</p>
                            <div class="d-flex gap-2 flex-wrap">
                                <button type="button" class="btn-fuel-ghost quick-fuel-btn" data-type="Petrol"
                                        style="padding:0.4rem 1rem;font-size:0.82rem;"> Petrol</button>
                                <button type="button" class="btn-fuel-ghost quick-fuel-btn" data-type="Diesel"
                                        style="padding:0.4rem 1rem;font-size:0.82rem;">️ Diesel</button>
                                <button type="button" class="btn-fuel-ghost quick-fuel-btn" data-type="Kerosene"
                                        style="padding:0.4rem 1rem;font-size:0.82rem;"> Kerosene</button>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-3 flex-wrap">
                            <button type="submit" id="searchBtn" class="btn-fuel-primary">
                                 Search Now
                            </button>
                            <button type="button" id="clearSearchBtn" class="btn-fuel-ghost">
                                 Clear
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" style="display:none;"></div>

    </div>
</main>

<!-- ══ FOOTER ══════════════════════════════════════════════════ -->
<footer class="fuel-footer">
    <div class="container">
        <p> <strong>Fuel QR Registration System</strong> — University Assignment Project</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>

<script>
// Quick fuel-type shortcut buttons
$(document).ready(function () {
    $('.quick-fuel-btn').on('click', function () {
        const type = $(this).data('type');
        $('#searchBy').val('fueltype');
        $('#searchValue').val(type).attr('placeholder', 'Petrol / Diesel / Kerosene');
        $('#searchForm').trigger('submit');
    });

    $('#clearSearchBtn').on('click', function () {
        $('#searchForm')[0].reset();
        $('#searchResults').fadeOut(300);
        $('#searchValue').attr('placeholder', 'Select a search type first...');
    });
});
</script>
</body>
</html>
